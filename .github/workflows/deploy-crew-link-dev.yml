name: Deploy Crew Link Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-crew-link-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy crew-link-dev
    runs-on: ubuntu-latest
    environment: crew-link-dev
    permissions:
      contents: read
    env:
      VITE_CREW_LINK_FIREBASE_APIKEY: "${{ secrets.VITE_CREW_LINK_FIREBASE_APIKEY }}"
      VITE_CREW_LINK_FIREBASE_AUTHDOMAIN: "${{ secrets.VITE_CREW_LINK_FIREBASE_AUTHDOMAIN }}"
      VITE_CREW_LINK_FIREBASE_PROJECTID: "${{ secrets.VITE_CREW_LINK_FIREBASE_PROJECTID }}"
      VITE_CREW_LINK_FIREBASE_STORAGEBUCKET: "${{ secrets.VITE_CREW_LINK_FIREBASE_STORAGEBUCKET }}"
      VITE_CREW_LINK_FIREBASE_MESSAGINGSENDERID: "${{ secrets.VITE_CREW_LINK_FIREBASE_MESSAGINGSENDERID }}"
      VITE_CREW_LINK_FIREBASE_APPID: "${{ secrets.VITE_CREW_LINK_FIREBASE_APPID }}"
      VITE_POSTHOG_KEY: "${{ secrets.VITE_POSTHOG_KEY }}"
      VITE_POSTHOG_HOST: "${{ secrets.VITE_POSTHOG_HOST }}"
      VITE_TITLE: "Crew Link DEV"
      VITE_FAVICON_PATH: "/theme/eidolon.svg"
      VITE_OPENGRAPH_PATH: "/assets/starforged/opengraph-default.png"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build web app
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase resources
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json firebase deploy --only hosting,firestore,storage,functions --project "$PROJECT_ID" --force
        env:
          GCP_SA_KEY: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          PROJECT_ID: "${{ secrets.FIREBASE_PROJECT_ID }}"
