name: Deploy Crew Link Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-crew-link-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build crew-link-dev
    runs-on: ubuntu-latest
    environment: crew-link-dev
    permissions:
      contents: read
    env:
      VITE_API_URL: "${{ secrets.VITE_API_URL }}"
      VITE_POSTHOG_KEY: "${{ secrets.VITE_POSTHOG_KEY }}"
      VITE_POSTHOG_HOST: "${{ secrets.VITE_POSTHOG_HOST }}"
      VITE_TITLE: "Crew Link DEV"
      VITE_FAVICON_PATH: "/theme/eidolon.svg"
      VITE_OPENGRAPH_PATH: "/assets/starforged/opengraph-default.png"
      VITE_GAME_SYSTEM: "starforged"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
