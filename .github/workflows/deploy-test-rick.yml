name: Deploy to Test (Rick)

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Rick
    runs-on: [self-hosted, rick]
    environment: test

    steps:
      - name: Pull latest code
        run: |
          cd /opt/starforged_test
          git fetch origin
          git checkout dev
          git reset --hard origin/dev

      - name: Install dependencies
        run: |
          cd /opt/starforged_test
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd /opt/starforged_test
          pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GAME_SYSTEM: starforged
          VITE_TITLE: "Starforged TEST"
          VITE_FAVICON_PATH: /theme/eidolon.svg
          VITE_OPENGRAPH_PATH: /assets/starforged/opengraph-default.png

      - name: Build API
        run: |
          cd /opt/starforged_test
          pnpm api:build

      - name: Run database migrations
        run: |
          cd /opt/starforged_test/api
          pnpm run drizzle:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy frontend to web root
        run: |
          rsync -a --delete /opt/starforged_test/dist/ /var/www/starforged/

      - name: Restart API service
        run: sudo systemctl restart starforged-api-test